name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The tag, the app, the plugin and the changelog must agree before anything is built.
      - name: Check the version
        id: version
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'
          . .\src\lib\Startup.ps1
          $app = $script:AgentampVersion
          $plugin = (Get-Content plugin\.claude-plugin\plugin.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$app") { throw "Tag $tag does not match the app's version $app." }
          if ($plugin -ne $app) { throw "plugin.json has version $plugin, the app $app." }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($app)) " -Quiet)) { throw "CHANGELOG.md has no entry for $app." }
          "version=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Install Pester
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester suite (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test.ps1

      - name: Build the release zip
        shell: powershell
        run: |
          $zip = .\scripts\build-release.ps1
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $zip
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $name`n")

          # The release notes: the changelog entry, then the zip's SHA-256.
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -like "## $version *" } | Select-Object -First 1))
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notlike '## *'; $i++) { $body += $lines[$i] }
          $notes = (($body -join "`n").Trim()) + "`n`n**SHA-256** of ``$name``:`n`n``````text`n$hash  $name`n```````n"
          [IO.File]::WriteAllText("$PWD\dist\notes.md", $notes)

      - name: Publish the GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create '${{ github.ref_name }}' "dist\agentamph-$version.zip" "dist\agentamph-$version.zip.sha256" `
            --title "agentamph $version" --notes-file dist\notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
